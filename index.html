<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>متابعة المذاكرة</title>
<style>
:root{--bg:#f6f4f1;--fg:#1d1b1a;--card:#fff;--mut:#6d6764;--bd:#e3ddd8;--ac:#2e7d6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1c1b;--fg:#f1ebe8;--card:#2c2826;--mut:#a79f9b;--bd:#3d3836}}
:root[data-theme="dark"]{--bg:#1f1c1b;--fg:#f1ebe8;--card:#2c2826;--mut:#a79f9b;--bd:#3d3836}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",Tahoma,sans-serif;padding-bottom:80px;max-width:640px;margin-inline:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;background:var(--ac);color:#fff}
header select{font:inherit;padding:5px;border-radius:8px;border:0;max-width:34%}
header b{font-size:17px}
main{padding:10px 12px}
nav{position:fixed;bottom:0;inset-inline:0;max-width:640px;margin-inline:auto;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:8px 0;font:inherit;font-size:12px}
nav button.on{color:var(--ac);font-weight:bold}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin:8px 0}
.c1{text-align:center}.big{font-size:32px;font-weight:bold;color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g2 .card{margin:0}
.bt{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit}
.bt.o{background:none;color:var(--ac);border:1.5px solid var(--ac)}
.ic{background:none;border:0;color:var(--fg);font-size:24px;padding:0 10px}
.g7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.g7 i{font-style:normal;font-size:11px;color:var(--mut)}
.c{padding:9px 0;border-radius:8px;background:var(--card);border:1px solid var(--bd)}
.c.g{background:#3fbf8a;color:#06281b}.c.m{background:#f0b84a;color:#3a2600}.c.r{background:#e0436f;color:#fff}
.c.sl{outline:2px solid var(--ac)}.c.td{font-weight:bold}.c.f{opacity:.85}
.tk{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-right:5px solid var(--ac);border-radius:8px;padding:9px 10px;margin:6px 0}
.tk span{flex:1}.tk small,.mu{color:var(--mut)}
.chips,.sw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.ch{padding:6px 10px;border-radius:16px;border:1.5px solid var(--ac);color:var(--ac)}
.ch.on{background:var(--ac);color:#fff}
.sw i{width:30px;height:30px;border-radius:50%;border:3px solid transparent;display:block}
.sw i.on{border-color:var(--fg)}
input:not([type=checkbox]){font:inherit;width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);margin:4px 0}
.bars{display:flex;gap:3px;height:130px;align-items:flex-end;margin:10px 0}
.bc{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bb{width:70%;background:var(--ac);border-radius:3px 3px 0 0;min-height:2px}
.bc small{font-size:10px;color:var(--mut)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9;display:flex;align-items:center;justify-content:center;padding:14px}
#md[hidden]{display:none}
.box{background:var(--card);color:var(--fg);border-radius:14px;padding:14px;width:100%;max-width:420px;max-height:90%;overflow:auto}
#sheet{position:fixed;left:-9999px;top:0;width:1100px;background:#fff;color:#111;padding:16px;direction:rtl}
#sheet table{width:100%;border-collapse:collapse;table-layout:fixed}
#sheet th{background:#1f4e5f;color:#fff;padding:6px;border:1px solid #fff}
#sheet td{vertical-align:top;border:1px solid #cfd8dc;padding:4px}
.sc{color:#fff;border-radius:6px;padding:4px 6px;margin-bottom:4px;font-size:13px}
@media print{@page{size:A4 landscape;margin:8mm}body>*:not(#sheet){display:none!important}#sheet{position:static!important;width:100%!important;padding:0}}
body.out header,body.out nav{display:none}
.lg{max-width:360px;margin:40px auto;text-align:center}
textarea{font:inherit;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--fg);margin:6px 0}
</style></head><body>
<header><select id="pf" onchange="S.cur=this.value;save();render()"></select><b>متابعة المذاكرة</b><button class="ic" style="color:#fff;font-size:20px" onclick="go('set')">⚙️</button></header>
<main id="v"></main>
<nav><button data-t="cal" onclick="go('cal')">📅<br>التقويم</button><button data-t="sch" onclick="go('sch')">🗓️<br>الجدول</button><button data-t="sm" onclick="go('sm')">📋<br>ملخص</button><button data-t="st" onclick="go('st')">📈<br>إحصائيات</button></nav>
<div id="md" hidden></div><div id="sheet"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
window.onerror=m=>{const v=document.querySelector('#v');if(v&&!v.innerHTML.trim())v.innerHTML='<div class="card"><b>حدث خطأ:</b><p dir="ltr">'+String(m).replace(/</g,'&lt;')+'</p></div>'};
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const DN=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'],SH=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'],ORD=[6,0,1,2,3,4,5];
const COL=['#2e7d6b','#3a6ea5','#7a5ea8','#b0623a','#2f8a8a','#a8486a','#b8860b'];
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const D0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
let S=load(),T='cal',P='w',today=D0(),cm=new Date(today.getFullYear(),today.getMonth(),1),sel=D0(),F=null,delArm=false;
function load(k){try{const s=JSON.parse(localStorage.getItem(k||'wt_x'));if(s&&s.p)return s}catch(e){}const id=uid();return{p:[{id,n:'الطفل'}],cur:id,t:{},d:{},c:COL[0],th:''}}
let U=null,CLOUD=false,tm,FS=null,AU=null,PEND='';
function save(){try{localStorage.setItem('wt_'+(U?U.uid:'x'),JSON.stringify(S))}catch(e){}if(U&&FS){clearTimeout(tm);tm=setTimeout(()=>FS.doc('users/'+U.uid).set({j:JSON.stringify(S),u:Date.now()}).then(()=>{CLOUD=true}).catch(()=>{CLOUD=false}),600)}}
const K=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const cur=()=>S.p.find(p=>p.id==S.cur);
const tl=()=>S.t[S.cur]||(S.t[S.cur]=[]);
const srt=(a,b)=>a.s<b.s?-1:1;
const ok=(x,d)=>!x.f||d.getTime()>=x.f;
const on=d=>tl().filter(x=>x.days.includes(d.getDay())&&ok(x,d)).sort(srt);
const dm=d=>(S.d[S.cur]||(S.d[S.cur]={}))[K(d)]||{};
const st=d=>{const t=on(d),m=dm(d);return{n:t.length,k:t.filter(x=>m[x.id]).length}};
const fmt=t=>{let[h,m]=t.split(':');h=+h;return(h%12||12)+':'+m+(h<12?' ص':' م')};
const pc=(k,n)=>n?Math.round(k*100/n):0;
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const agg=ds=>ds.reduce((a,d)=>{const s=st(d);a.n+=s.n;a.k+=s.k;return a},{n:0,k:0});
function rg(p){const r=[];if(p=='w')for(let i=6;i>=0;i--)r.push(addD(today,-i));else if(p=='m')for(let i=1;i<=today.getDate();i++)r.push(new Date(today.getFullYear(),today.getMonth(),i));else for(let d=new Date(today.getFullYear(),0,1);d<=today;d=addD(d,1))r.push(d);return r}
function streak(){let c=0;for(let i=0;i<400;i++){const s=st(addD(today,-i));if(!s.n)continue;if(s.k==s.n)c++;else if(i)break}return c}
const dark=()=>S.th?S.th=='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const ap=()=>{document.documentElement.dataset.theme=S.th;document.documentElement.style.setProperty('--ac',S.c)};
const hd=()=>{$('#pf').innerHTML=S.p.map(p=>`<option value="${p.id}" ${p.id==S.cur?'selected':''}>${E(p.n)}</option>`).join('')};
const go=t=>{T=t;delArm=false;render()};
const mv=n=>{cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);render()};
const pick=d=>{sel=new Date(cm.getFullYear(),cm.getMonth(),d);render()};
function tg(id){const o=S.d[S.cur]||(S.d[S.cur]={}),k=K(sel),m=o[k]||(o[k]={});m[id]?delete m[id]:m[id]=1;save();render()}
function vcal(){const Y=cm.getFullYear(),M=cm.getMonth(),off=(cm.getDay()+1)%7,nd=new Date(Y,M+1,0).getDate();
let h=`<div class="row"><button class="ic" onclick="mv(-1)">›</button><b>${MN[M]} ${Y}</b><button class="ic" onclick="mv(1)">‹</button></div><div class="g7">`+ORD.map(i=>`<i>${SH[i]}</i>`).join('');
for(let i=0;i<off;i++)h+='<b></b>';
for(let d=1;d<=nd;d++){const dt=new Date(Y,M,d),s=st(dt);let c=!s.n?'':dt>today?'f':s.k==s.n?'g':s.k?'m':'r';if(K(dt)==K(sel))c+=' sl';if(K(dt)==K(today))c+=' td';h+=`<div class="c ${c}" onclick="pick(${d})">${d}</div>`}
const t=on(sel),m=dm(sel);
h+=`</div><div class="row"><b>${DN[sel.getDay()]} ${sel.getDate()} ${MN[sel.getMonth()]}</b></div>`;
h+=t.length?t.map(x=>`<label class="tk" style="border-right-color:${x.c}"><input type="checkbox" ${m[x.id]?'checked':''} onchange="tg('${x.id}')"><span>${E(x.t)}</span><small>${fmt(x.s)} – ${fmt(x.e)}</small></label>`).join(''):'<p class="mu">لا مهام في هذا اليوم، أضفها من تبويب الجدول.</p>';
return h}
function vsch(){return`<div class="row"><button class="bt" onclick="ed()">+ مهمة جديدة</button><span><button class="bt o" onclick="shareImg()">صورة</button> <button class="bt o" onclick="window.print()">PDF / طباعة</button></span></div>`+ORD.map(i=>{const t=tl().filter(x=>x.days.includes(i)).sort(srt);return`<div class="card"><b>${DN[i]}</b>`+(t.length?t.map(x=>`<div class="tk" style="border-right-color:${x.c}" onclick="ed('${x.id}')"><span>${E(x.t)}</span><small>${fmt(x.s)} – ${fmt(x.e)}</small></div>`).join(''):'<p class="mu">—</p>')+'</div>'}).join('')}
function vsum(){const a=st(today),w=agg(rg('w'));return`<div class="card c1"><div class="big">${pc(a.k,a.n)}%</div><div>إنجاز اليوم (${a.k} من ${a.n})</div></div><div class="card c1"><div class="big">${pc(w.k,w.n)}%</div><div>إنجاز آخر 7 أيام</div></div><div class="g2"><div class="card c1"><div class="big">⭐ ${w.k}</div><div>مهام تمت هذا الأسبوع</div></div><div class="card c1"><div class="big">🔥 ${streak()}</div><div>أيام متتالية مكتملة</div></div></div>`}
function vst(){const ds=rg(P),tot=agg(ds);let cols;
if(P=='y')cols=MN.map((m,i)=>{const a=agg(ds.filter(d=>d.getMonth()==i));return[i+1,pc(a.k,a.n),a.n]});
else cols=ds.map(d=>{const s=st(d);return[P=='w'?SH[d.getDay()]:d.getDate(),pc(s.k,s.n),s.n]});
const pt=tl().map(x=>{let n=0,k=0;ds.forEach(d=>{if(x.days.includes(d.getDay())&&ok(x,d)){n++;if(dm(d)[x.id])k++}});return{x,n,k}}).filter(r=>r.n);
return`<div class="chips">${[['w','أسبوع'],['m','شهر'],['y','سنة']].map(([k,l])=>`<span class="ch ${P==k?'on':''}" onclick="P='${k}';render()">${l}</span>`).join('')}</div><div class="card c1"><div class="big">${pc(tot.k,tot.n)}%</div><div>نسبة الإنجاز (${tot.k} من ${tot.n} مهمة)</div></div><div class="card"><div class="bars">${cols.map(c=>`<div class="bc"><div class="bb" style="height:${c[2]?Math.max(c[1],4):0}%"></div><small>${c[0]}</small></div>`).join('')}</div></div><b>حسب المهمة</b>`+(pt.length?pt.map(r=>`<div class="tk" style="border-right-color:${r.x.c}"><span>${E(r.x.t)}</span><small>${pc(r.k,r.n)}% (${r.k}/${r.n})</small></div>`).join(''):'<p class="mu">لا بيانات بعد.</p>')}
function vset(){return`<div class="card"><b>لون التطبيق</b><div class="sw">${COL.map(c=>`<i style="background:${c}" class="${c==S.c?'on':''}" onclick="S.c='${c}';save();render()"></i>`).join('')}</div></div><div class="card"><label class="row"><span>المظهر الليلي</span><input type="checkbox" ${dark()?'checked':''} onchange="S.th=this.checked?'dark':'light';save();render()"></label></div><div class="card"><b>الملف الحالي</b><input value="${E(cur().n)}" onchange="cur().n=this.value||'الطفل';save();hd()"><div class="row"><button class="bt" onclick="addP()">+ ملف جديد</button>${S.p.length>1?`<button class="bt o" onclick="delP()">${delArm?'اضغط للتأكيد':'حذف الملف'}</button>`:''}</div></div><div class="card"><b>الحساب</b><p>${E(S.un||'')}</p><p class="mu">${CLOUD?'☁️ بياناتك محفوظة على السحابة وتتزامن تلقائيًا':'⚠️ لا يوجد اتصال بالسحابة الآن، سيتم الحفظ عند عودة الإنترنت'}</p><button class="bt o" onclick="AU.signOut()">تسجيل الخروج</button></div><p class="mu">الإصدار 2.0</p>`}
function addP(){const id=uid();S.p.push({id,n:'طفل جديد'});S.cur=id;save();hd();render()}
function delP(){if(!delArm){delArm=true;render();return}S.p=S.p.filter(p=>p.id!=S.cur);delete S.t[S.cur];delete S.d[S.cur];S.cur=S.p[0].id;delArm=false;save();hd();render()}
function ed(id){F=id?{...tl().find(x=>x.id==id)}:{id:'',t:'',s:'16:00',e:'17:00',days:[today.getDay()],c:COL[1]};fm()}
function fm(){const m=$('#md');m.hidden=false;m.innerHTML=`<div class="box"><b>${F.id?'تعديل مهمة':'مهمة جديدة'}</b><input id="ft" placeholder="اسم المهمة" value="${E(F.t)}"><div class="row"><label>من <input type="time" id="fs" value="${F.s}"></label><label>إلى <input type="time" id="fe" value="${F.e}"></label></div><div class="chips">${ORD.map(i=>`<span class="ch ${F.days.includes(i)?'on':''}" onclick="fd(${i})">${SH[i]}</span>`).join('')}</div><div class="sw">${COL.map(c=>`<i style="background:${c}" class="${c==F.c?'on':''}" onclick="F.c='${c}';rd()"></i>`).join('')}</div><div class="row"><button class="bt" onclick="sv()">حفظ</button>${F.id?'<button class="bt o" onclick="rm()">حذف</button>':''}<button class="bt o" onclick="cl()">إلغاء</button></div></div>`}
function rd(){F.t=$('#ft').value;F.s=$('#fs').value;F.e=$('#fe').value;fm()}
function fd(i){rd();F.days=F.days.includes(i)?F.days.filter(x=>x!=i):[...F.days,i];fm()}
function sv(){F.t=$('#ft').value.trim();F.s=$('#fs').value;F.e=$('#fe').value;if(!F.t||!F.s||!F.e||!F.days.length)return;const l=tl();if(F.id){const i=l.findIndex(x=>x.id==F.id);l[i]=F}else l.push({...F,id:uid(),f:today.getTime()});save();cl();render()}
function rm(){S.t[S.cur]=tl().filter(x=>x.id!=F.id);save();cl();render()}
function cl(){$('#md').hidden=true;$('#md').innerHTML=''}
function bs(){$('#sheet').innerHTML=`<h2>الجدول الأسبوعي — ${E(cur().n)}</h2><table><tr>${ORD.map(i=>`<th>${DN[i]}</th>`).join('')}</tr><tr>${ORD.map(i=>'<td>'+tl().filter(x=>x.days.includes(i)).sort(srt).map(x=>`<div class="sc" style="background:${x.c}"><small>${fmt(x.s)} – ${fmt(x.e)}</small><br>${E(x.t)}</div>`).join('')+'</td>').join('')}</tr></table>`}
async function shareImg(){if(!window.html2canvas){alert('تعذر تحميل أداة الصورة، استخدم PDF / طباعة');return}
const cv=await html2canvas($('#sheet'),{scale:2,backgroundColor:'#ffffff'});
cv.toBlob(async b=>{const f=new File([b],'schedule.png',{type:'image/png'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]});return}catch(e){if(e.name=='AbortError')return}}
const m=$('#md');m.hidden=false;m.innerHTML=`<div class="box"><b>اضغط مطولًا على الصورة لحفظها أو مشاركتها</b><img src="${cv.toDataURL()}" style="width:100%"><button class="bt" onclick="cl()">إغلاق</button></div>`})}
const V={cal:vcal,sch:vsch,sm:vsum,st:vst,set:vset};
function render(){ap();if(!U){document.body.classList.add('out');$('#v').innerHTML=vlog();return}document.body.classList.remove('out');bs();$('#v').innerHTML=V[T]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==T))}
const FB={apiKey:"AIzaSyDtyqLzfeJe-sRAeR29Nw13UZdXqZmX9Rg",authDomain:"task-tracker-fc6c8.firebaseapp.com",projectId:"task-tracker-fc6c8",appId:"1:427178568889:web:fd8afb27f3fda8ef9f3f68"}; // ← الصق إعدادات Firebase هنا (أو من شاشة الإعداد الأولى)
const fbcfg=()=>FB.apiKey?FB:(()=>{try{return JSON.parse(localStorage.getItem('fbcfg'))}catch(e){return null}})();
async function hx(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const nm=u=>u.normalize('NFKC').trim().replace(/\s+/g,' ').toLowerCase();
async function cred(u,p){const n=nm(u);return{e:(await hx('u:'+n)).slice(0,40)+'@study.app',p:(await hx('p:'+n+':'+p+':st1')).slice(0,32)}}
const lerr=m=>{const e=$('#le');if(e)e.textContent=m};
const AERR={'auth/email-already-in-use':'اسم المستخدم مستخدم بالفعل، اختر اسمًا آخر','auth/user-not-found':'اسم المستخدم أو الرقم السري غير صحيح','auth/wrong-password':'اسم المستخدم أو الرقم السري غير صحيح','auth/invalid-credential':'اسم المستخدم أو الرقم السري غير صحيح','auth/too-many-requests':'محاولات كثيرة، حاول بعد قليل','auth/network-request-failed':'تأكد من الاتصال بالإنترنت','auth/operation-not-allowed':'فعّل Email/Password من Firebase Authentication'};
async function doAuth(m){const u=$('#lu').value,p=$('#lp').value;if(!nm(u)||!p){lerr('اكتب اسم المستخدم والرقم السري');return}
lerr('جارٍ المعالجة…');try{const c=await cred(u,p);PEND=u.trim();if(m=='up')await AU.createUserWithEmailAndPassword(c.e,c.p);else await AU.signInWithEmailAndPassword(c.e,c.p)}catch(e){PEND='';lerr(AERR[e.code]||('خطأ: '+(e.code||e.message)))}}
function vlog(){if(!fbcfg())return`<div class="card lg"><h2>إعداد Firebase</h2><p class="mu">الصق هنا إعدادات مشروعك (firebaseConfig)</p><textarea id="cf" rows="8" style="width:100%" dir="ltr"></textarea><button class="bt" onclick="svc()">حفظ</button></div>`;
